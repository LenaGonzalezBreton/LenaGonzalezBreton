<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450" role="img" aria-labelledby="title description">
  <title id="title">AI-powered content automation</title>
  <desc id="description">Target architecture. Content upload triggers Amazon S3, then AWS Lambda and AI process and render content and generate captions. Instagram Graph API publishes the result.</desc>
